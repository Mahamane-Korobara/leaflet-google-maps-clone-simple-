<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-rotatedmarker@0.2.0/leaflet.rotatedMarker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-map-rotation@0.3.0/dist/leaflet-rotation.min.js"></script>
    <title>Map</title>
</head>
<body>
     <div id="legend">
        <h3>Légende des marqueurs</h3>
        <ul>
            <li><img src="assets/img/marker-icon-red.png" alt="Restaurant" width="24" height="24"> Restaurant (rouge)</li>
            <li><img src="assets/img/marker-icon-blue.png" alt="Arrêt de bus" width="24" height="24"> Arrêt de bus (bleu)</li>
            <li><img src="assets/img/marker-icon-green.png" alt="Tram" width="24" height="24"> Tram (vert)</li>
            <li><img src="assets/img/marker-icon-grey.png" alt="Recherche" width="24" height="24"> Résultat de recherche (marron)</li>
            <li><img src="assets/img/marker-icon-gold.png" alt="Utilisateur" width="24" height="24"> Ma position (doré)</li>
            <li><img src="assets/img/marker-icon-violet.png" alt="Clic personnalisé" width="24" height="24"> Marqueur personnalisé (violet)</li>
        </ul>
    </div>
    <form id="searchForm">
        <input type="text" id="searchInput" placeholder="Entrez un nom de lieu" required>
        <button type="submit">Rechercher</button>
    </form>

    <div id="controls">
        <button id="satelliteView">Vue Satellite</button>
        <button id="mapView">Vue Carte</button>
    </div>

    <div id="error-message"></div>
    <div id="map"></div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
